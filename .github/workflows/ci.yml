name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Vendor Helvety monorepo packages
        run: node scripts/ensure-helvety.mjs

      - name: Install, verify, and build
        run: |
          pnpm install --frozen-lockfile
          pnpm run ci:release
